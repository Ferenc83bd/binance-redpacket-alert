name: Get Binance UID

on:
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Find profile
        run: node node_modules/binance-square-cli/dist/index.js user BTCxiao6 --pretty
